name: Daily YouTube Live

on:
  workflow_dispatch:
  schedule:
    # 20:00 Europe/Rome during daylight-saving time (18:00 UTC).
    # During winter this runs at 19:00 Europe/Rome because GitHub cron uses UTC.
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: daily-youtube-live
  cancel-in-progress: false

jobs:
  gate:
    name: Check Rome start time
    runs-on: ubuntu-latest
    outputs:
      run_stream: ${{ steps.check.outputs.run_stream }}
    steps:
      - id: check
        shell: bash
        run: |
          echo "run_stream=true" >> "$GITHUB_OUTPUT"
          echo "Single daily schedule accepted; delayed execution is allowed."

  stream:
    needs: gate
    if: ${{ github.event.repository.private == false && needs.gate.outputs.run_stream == 'true' }}
    name: Stream Daily Channel
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Restore and validate private files
        env:
          COOKIES_RIMAL_B64: ${{ secrets.COOKIES_RIMAL_B64 }}
          COOKIES_SANDS_B64: ${{ secrets.COOKIES_SANDS_B64 }}
          COOKIES_CRIME_B64: ${{ secrets.COOKIES_CRIME_B64 }}
          COOKIES_VOICES_B64: ${{ secrets.COOKIES_VOICES_B64 }}
          TOKEN_CHANNEL11_B64: ${{ secrets.TOKEN_CHANNEL11_B64 }}
          TOKEN_CHANNEL12_B64: ${{ secrets.TOKEN_CHANNEL12_B64 }}
          TOKEN_CHANNEL13_B64: ${{ secrets.TOKEN_CHANNEL13_B64 }}
          TOKEN_CHANNEL14_B64: ${{ secrets.TOKEN_CHANNEL14_B64 }}
        shell: bash
        run: |
          set -uo pipefail

          restore_secret() {
            local secret_name="$1"
            local secret_value="$2"
            local output_path="$3"
            local normalized_value
            local temporary_path="${output_path}.tmp"

            rm -f "$output_path" "$temporary_path"
            if [ -z "$secret_value" ]; then
              echo "::warning title=Unavailable channel credential::${secret_name} is empty."
              return 1
            fi

            normalized_value="$(printf '%s' "$secret_value" | tr -d '\r\n\t ')"
            if [[ "$normalized_value" =~ ^[A-Za-z0-9+/]+={0,2}$ ]] && \
               (( ${#normalized_value} % 4 == 0 )) && \
               printf '%s' "$normalized_value" | base64 --decode > "$temporary_path" 2>/dev/null; then
              echo "Decoded ${secret_name} as Base64."
            else
              printf '%s' "$secret_value" > "$temporary_path"
              echo "Stored ${secret_name} as plain text."
            fi

            if [ ! -s "$temporary_path" ]; then
              echo "::warning title=Invalid channel credential::${secret_name} produced an empty file."
              rm -f "$temporary_path"
              return 1
            fi

            mv "$temporary_path" "$output_path"
            chmod 600 "$output_path"
          }

          validate_cookie_file() {
            local secret_name="$1"
            local cookie_path="$2"
            local header counts valid_rows invalid_rows

            header="$(head -n 1 "$cookie_path" | sed $'s/^\xEF\xBB\xBF//' | tr -d '\r')"
            if [[ "$header" != "# Netscape HTTP Cookie File"* ]]; then
              echo "::warning title=Skipping malformed cookie secret::${secret_name} is not a complete Netscape cookies.txt file."
              return 1
            fi

            counts="$(awk -F '\t' '
              BEGIN { valid = 0; invalid = 0 }
              {
                          sub(/\r$/, "")
                          if ($0 ~ /^[[:space:]]*$/) next
                          if ($0 ~ /^#HttpOnly_/) { if (NF >= 7) valid++; else invalid++; next }
                          if ($0 ~ /^[[:space:]]*#/) next
                          if (NF >= 7) valid++; else invalid++
                        }
                        END { printf "%d %d", valid, invalid }
                      ' "$cookie_path")"
                      read -r valid_rows invalid_rows <<< "$counts"
            if (( invalid_rows > 0 || valid_rows == 0 )); then
              echo "::warning title=Skipping malformed cookie secret::${secret_name} has ${valid_rows} valid and ${invalid_rows} malformed Netscape row(s)."
              return 1
            fi
            echo "Validated ${secret_name}: ${valid_rows} Netscape cookie row(s)."
          }

          validate_token_file() {
            local secret_name="$1"
            local token_path="$2"
            if ! python3 - "$token_path" <<'PY'
import json
import sys
path = sys.argv[1]
with open(path, encoding="utf-8") as handle:
    data = json.load(handle)
required = ("client_id", "client_secret", "refresh_token")
if not isinstance(data, dict) or any(not data.get(key) for key in required):
    raise ValueError("OAuth token JSON lacks required fields")
PY
            then
              echo "::warning title=Skipping malformed token secret::${secret_name} is not a valid YouTube OAuth token JSON file."
              return 1
            fi
            echo "Validated ${secret_name}."
          }

          prepare_channel() {
            local channel="$1" cookie_secret="$2" cookie_value="$3" cookie_path="$4"
            local token_secret="$5" token_value="$6" token_path="$7"

            rm -f "$cookie_path" "$token_path"
            if ! restore_secret "$cookie_secret" "$cookie_value" "$cookie_path" || \
               ! validate_cookie_file "$cookie_secret" "$cookie_path" || \
               ! restore_secret "$token_secret" "$token_value" "$token_path" || \
               ! validate_token_file "$token_secret" "$token_path"; then
              rm -f "$cookie_path" "$token_path"
              echo "::warning title=Channel skipped::${channel} was disabled for this run because ${cookie_secret} or ${token_secret} is missing or malformed."
              return 1
            fi

            echo "Channel ${channel} is ready (${cookie_secret} + ${token_secret})."
            return 0
          }

          usable_channels=0
          prepare_channel channel11 COOKIES_RIMAL_B64 "$COOKIES_RIMAL_B64" cookies_rimal.txt TOKEN_CHANNEL11_B64 "$TOKEN_CHANNEL11_B64" token_channel11.json && usable_channels=$((usable_channels + 1))
          prepare_channel channel12 COOKIES_SANDS_B64 "$COOKIES_SANDS_B64" cookies_sands.txt TOKEN_CHANNEL12_B64 "$TOKEN_CHANNEL12_B64" token_channel12.json && usable_channels=$((usable_channels + 1))
          prepare_channel channel13 COOKIES_CRIME_B64 "$COOKIES_CRIME_B64" cookies_crime.txt TOKEN_CHANNEL13_B64 "$TOKEN_CHANNEL13_B64" token_channel13.json && usable_channels=$((usable_channels + 1))
          prepare_channel channel14 COOKIES_VOICES_B64 "$COOKIES_VOICES_B64" cookies_voices.txt TOKEN_CHANNEL14_B64 "$TOKEN_CHANNEL14_B64" token_channel14.json && usable_channels=$((usable_channels + 1))

          if (( usable_channels == 0 )); then
            echo "::error title=No usable YouTube channel::All four cookie/token pairs are missing or malformed. Refresh at least one complete pair."
            exit 1
          fi
          echo "Usable channels for this run: ${usable_channels}."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up PO token provider (bgutil)
        run: |
          git clone --single-branch --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts=npm:canvas --frozen
          nohup deno task start > bgutil.log 2>&1 &
          echo "bgutil POT provider server started in background."

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade --pre "yt-dlp[default]"

      - name: Validate configuration
        run: |
          python -m json.tool config.json > /dev/null
          python -c "import json; d=json.load(open('config.json', encoding='utf-8')); print('Channels:', list(d['channels'].keys()))"

      - name: Start three-hour live stream
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          END_TIME=$((SECONDS + 10800))

          while [ "$SECONDS" -lt "$END_TIME" ]; do
            echo "Starting the next live video..."
            python daily_live.py

            EXIT_CODE=$?

            if [ "$EXIT_CODE" -ne 0 ]; then
              echo "daily_live.py failed with exit code $EXIT_CODE"
              exit "$EXIT_CODE"
            fi

            if [ "$SECONDS" -lt "$END_TIME" ]; then
              echo "Video completed. Waiting 5 seconds..."
              sleep 5
            fi
          done

          echo "Three-hour daily streaming limit completed."
